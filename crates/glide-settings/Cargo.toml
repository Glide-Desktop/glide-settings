[package]
name = "glide-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_settings"
path = "src/lib.rs"

[[bin]]
name = "glide-settings"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
glide-config.workspace = true
glide-sdk.workspace = true
glide-app.workspace = true
glide-ipc.workspace = true
glide-netbird.workspace = true
glide-paint.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
toml.workspace = true
toml_edit = "0.25"
zbus.workspace = true

[dev-dependencies]
glide-theme.workspace = true
iced_tiny_skia = { version = "0.14", default-features = false }
